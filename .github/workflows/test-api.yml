name: Test StoryGraph API

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  api-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check DNS resolution
        run: |
          host app.thestorygraph.com
          host thestorygraph.com

      - name: Check TLS certificate validity
        run: |
          echo | openssl s_client -connect app.thestorygraph.com:443 -servername app.thestorygraph.com 2>/dev/null | openssl x509 -noout -dates
          echo | openssl s_client -connect app.thestorygraph.com:443 -servername app.thestorygraph.com 2>/dev/null | openssl x509 -noout -checkend 604800
          # -checkend 604800 = verify cert won't expire in the next 7 days

      - name: Check HTTPS connectivity
        run: |
          # Just verify we can complete a TLS handshake and get any HTTP response
          # Cloudflare may return 403 to CI IPs, but any response means the service is up
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://app.thestorygraph.com/" || echo "000")
          echo "Root endpoint HTTP status: $code"
          # Any response (200, 301, 302, 403, 503) means the service is reachable
          [ "$code" != "000" ] || exit 1
