name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bundle plugin into storygraph.koplugin
        run: |
          mkdir -p storygraph.koplugin
          cp *.lua storygraph.koplugin/
          zip -r "storygraph.koplugin-${{ github.ref_name }}.zip" storygraph.koplugin/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: storygraph.koplugin-${{ github.ref_name }}.zip
          generate_release_notes: true
